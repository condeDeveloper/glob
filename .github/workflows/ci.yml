name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ${{ matrix.so }}

    # bash nos tres sistemas: no Windows o shell padrao e o PowerShell, e ele
    # desmonta "-Dexec.args=..." em dois argumentos antes de o Maven ver.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        so: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Testes
        run: mvn -B -ntp verify

      - name: os tres casadores contra o automato
        run: mvn -B -ntp -q exec:java -Dexec.args="definicao"

      - name: a enumeracao exaustiva
        run: mvn -B -ntp -q exec:java -Dexec.args="exaustiva"

      - name: o retrocesso catastrofico
        run: mvn -B -ntp -q exec:java -Dexec.args="catastrofe"

      - name: o custo de cada casador
        run: mvn -B -ntp -q exec:java -Dexec.args="custo"

      - name: as classes de caracteres
        run: mvn -B -ntp -q exec:java -Dexec.args="classes"

      - name: Relatorios de teste
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.so }}
          path: target/surefire-reports
